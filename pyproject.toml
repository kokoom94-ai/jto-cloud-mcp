[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jto-cloud-mcp"
version = "0.1.0"
description = "Hosted MCP for three supplied JTO report templates and signed downloads"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "uvicorn==0.53.0", "olefile==0.47", "jsonschema==4.26.0", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
jto-cloud-mcp = "jto_cloud.server:main"

[tool.setuptools.packages.find]
include = ["jto_cloud*"]

[tool.setuptools.package-data]
jto_cloud = ["templates/*.hwpx", "templates/*.hwp", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
